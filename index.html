<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Second </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <span class="logo_icon">🍊</span>
            <span>ORDERIT</span>
        </div>


        <div class="location">
            <span>📍</span>
            <span>Location</span>
        </div>

        <nav class="links">
            <a href="#" class="active">HOME</a>
            <a href="#">SHOP</a>
            <a href="#">OFFERS</a>
            <a href="#">RESTAURENTS</a>
            <a href="#">PAGES</a>
            <a href="#">CONTACT</a>
        </nav>

        <div class="nav_icon">

            <a href="#" class="cart">🛒</a>
            <a href="#" class="profile">👤</a>

        </div>

    </header>

   <section class="hero">

    <div class="hero-content">

        <h1>
            Order food. Discover best
            restaurants. Orderit!
        </h1>

        <p class="hero-description">
            We offer flexible delivery options tailored to your needs—
            whether it's urgent same-day supplies, or specialty products.
        </p>

        <form class="search-box">
            <input
                type="text"
                placeholder="Search for restaurant, item or more"
            >

            <button type="submit">Search →</button>
        </form>

    </div>

</section>



<section class="food-categories">

    <div class="food-card">
        <img src="images/P1.jpg" alt="Pasta">
        <h3>Pasta</h3>
    </div>

    <div class="food-card">
        <img src="images/P2.jpg" alt="Pizza">
        <h3>Pizza</h3>
    </div>

    <div class="food-card">
        <img src="images/P3.jpg" alt="Egg Items">
        <h3>Egg Items</h3>
    </div>

    <div class="food-card">
        <img src="images/P4.jpg" alt="Mexican Food">
        <h3>Mexican Food</h3>
    </div>

    <div class="food-card">
        <img src="images/P5.jpg" alt="Goodies">
        <h3>Goodies</h3>
    </div>

    <div class="food-card">
        <img src="images/P6.jpg" alt="Sushi">
        <h3>Sushi</h3>
    </div>

</section>


     
    
</body>
</html>
